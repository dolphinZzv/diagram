    <title>Diagram — 流程图设计器</title>
    <style>
      /* First-paint skeleton shown until the JS bundle boots (React replaces
         #root on mount). Keeps the app from flashing a blank screen. */
      .boot-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        color: #64748b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-skeleton__bar {
        height: 56px;
        flex: none;
        border-bottom: 1px solid #e2e8f0;
        background: #fff;
      }
      .boot-skeleton__body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .boot-skeleton__side {
        width: 210px;
        flex: none;
        border-right: 1px solid #e2e8f0;
        background: #fff;
      }
      .boot-skeleton__main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(#cbd5e1 1.2px, transparent 1.2px) 0 0 / 20px 20px, #f8fafc;
      }
      .boot-skeleton__spinner {
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        border: 2.5px solid #cbd5e1;
        border-top-color: #3b82f6;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot-skeleton {
          background: #0b1220;
          color: #94a3b8;
        }
        .boot-skeleton__bar,
        .boot-skeleton__side {
          background: #0f172a;
          border-color: #1e293b;
        }
        .boot-skeleton__main {
          background: radial-gradient(#1e293b 1.2px, transparent 1.2px) 0 0 / 20px 20px, #0b1220;
        }
        .boot-skeleton__spinner {
          border-color: #1e293b;
          border-top-color: #3b82f6;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-D4N7bMgr.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-Cn7g0jB0.js">
    <link rel="modulepreload" crossorigin href="/assets/xyflow-CsNhll3h.js">
    <link rel="modulepreload" crossorigin href="/assets/radix-DsP3z89Q.js">
    <link rel="modulepreload" crossorigin href="/assets/icons-DaY7nngw.js">
    <link rel="stylesheet" crossorigin href="/assets/xyflow-BnuhLJ6X.css">
    <link rel="stylesheet" crossorigin href="/assets/index-D9krue5O.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-skeleton" role="status" aria-label="Loading">
        <div class="boot-skeleton__bar"></div>
        <div class="boot-skeleton__body">
          <div class="boot-skeleton__side"></div>
          <div class="boot-skeleton__main"><span class="boot-skeleton__spinner"></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
